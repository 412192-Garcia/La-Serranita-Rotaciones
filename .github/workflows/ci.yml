name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Back/La Serranita rotaciones"
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y correr tests
        run: ./mvnw -B verify

  frontend:
    name: Frontend (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build de producción
        run: npx ng build --configuration production

      # Con el mismo nginx de la imagen: una config inválida deja el front reiniciándose (502 en todo).
      # --add-host: nginx -t resuelve el proxy_pass al backend, que acá no existe.
      - name: Validar nginx.conf
        run: >
          docker run --rm --add-host rotaciones-backend:127.0.0.1
          -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:alpine nginx -t

  # Arma las imágenes del backend y del front y las sube a GitHub Container Registry. El VPS sólo las baja
  # (scripts/deploy.sh): no clona el repo ni compila nada.
  publish-images:
    name: Publicar imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit
        id: version
        run: echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Además de latest, el commit: para volver a una versión anterior alcanza con poner ese tag en el compose.
      - name: Build y push — backend
        uses: docker/build-push-action@v6
        with:
          context: "./Back/La Serranita rotaciones"
          push: true
          tags: |
            ghcr.io/412192-garcia/la-serranita-rotaciones-backend:latest
            ghcr.io/412192-garcia/la-serranita-rotaciones-backend:${{ steps.version.outputs.commit }}

      - name: Build y push — frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Front
          push: true
          tags: |
            ghcr.io/412192-garcia/la-serranita-rotaciones-frontend:latest
            ghcr.io/412192-garcia/la-serranita-rotaciones-frontend:${{ steps.version.outputs.commit }}
