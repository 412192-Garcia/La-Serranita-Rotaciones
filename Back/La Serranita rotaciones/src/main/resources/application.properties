spring.application.name=La Serranita rotaciones

# dev = H2 en un archivo (data/), prod = Postgres (ver application-prod.properties).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8082}

# Orígenes permitidos por CORS, separados por coma.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4300}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Login: la clave con que se firman los tokens (al menos 32 caracteres; en producción, JWT_SECRET del .env).
# Duración de la sesión: 12 horas, o 14 días con "No cerrar sesión".
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
jwt.remember-expiration-ms=${JWT_REMEMBER_EXPIRATION_MS:1209600000}
