# Los cronogramas quedan en data/rotaciones.mv.db y sobreviven a los reinicios.
spring.datasource.url=jdbc:h2:file:./data/rotaciones;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sólo para desarrollo: en producción JWT_SECRET es obligatorio.
jwt.secret=${JWT_SECRET:clave-de-desarrollo-rotaciones-no-usar-en-produccion}
