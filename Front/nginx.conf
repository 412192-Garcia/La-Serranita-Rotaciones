server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Sin esto nginx corta las subidas en 1 MB; el backend acepta hasta 10 MB.
    client_max_body_size 10m;

    location ~ "-[A-Z0-9]{8}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # rotaciones-backend: el nombre del backend en la red de Docker (ver docker-compose.yml).
        proxy_pass http://rotaciones-backend:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
